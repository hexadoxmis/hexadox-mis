<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Doctor Master</title>
<link rel="stylesheet" href="style.css?v=20260906-3">
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#222;font-family:Arial,sans-serif}.container{width:100%;max-width:none;margin:0 auto;padding:24px 28px 45px}.page-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;padding:16px 20px;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);border-left:5px solid #f0c419}.page-top h2{margin:0;font-size:24px;letter-spacing:.4px;color:#222}.back-button{min-width:110px;background:#fff;color:#222;border:1px solid #ddd;padding:10px 20px;border-radius:7px;cursor:pointer;font-weight:700}.card{background:#fff;border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.07)}.card h3{margin:0 0 18px;font-size:18px;color:#333;padding-bottom:12px;border-bottom:1px solid #eee}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:18px;align-items:end}label{display:block;font-size:13px;font-weight:700;color:#555;margin:0 0 7px}input,select{width:100%;height:42px;padding:9px 11px;border:1px solid #d5d9dc;border-radius:7px;background:#fff;color:#222;font-size:14px}input:focus,select:focus{outline:none;border-color:#d6ad00;box-shadow:0 0 0 2px rgba(240,196,25,.18)}.actions{margin-top:18px;display:flex;justify-content:flex-end}.btn,.small-btn{border:0;border-radius:7px;background:#f0c419;color:#222;font-weight:700;cursor:pointer}.btn{height:42px;padding:0 24px;min-width:190px}.btn:hover,.small-btn:hover{filter:brightness(.97)}.inline-add{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid #eee}.inline-add .small-btn{padding:0 18px;min-width:245px}.message{min-height:20px;margin-top:12px;font-size:13px;font-weight:600}.message.success{color:#2e7d32}.message.error{color:#c62828}.filters{display:grid;grid-template-columns:190px 190px 1fr;gap:12px;margin-bottom:16px}.table-wrap{width:100%;overflow-x:auto;border:1px solid #e4e6e8;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px}th{background:#292929;color:#fff;font-size:13px;padding:11px 12px;text-align:left;white-space:nowrap}td{padding:11px 12px;border-top:1px solid #eee;font-size:14px;vertical-align:middle}tbody tr:hover{background:#fffdf0}td:last-child{width:120px}.small-btn{padding:9px 13px;font-size:13px;white-space:nowrap}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.edit-btn{background:#e8f0fe;color:#174ea6}.delete-btn{background:#f8d7da;color:#842029}.cancel-btn{background:#eee;color:#333}@media(max-width:800px){.container{padding:16px 14px 35px}.form-grid{grid-template-columns:1fr}.actions{justify-content:stretch}.btn{width:100%}.inline-add{grid-template-columns:1fr}.inline-add .small-btn{width:100%;height:42px}.filters{grid-template-columns:1fr}.page-top h2{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<div class="page-top"><h2>DOCTOR MASTER</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div>
<div class="card"><h3 id="doctorFormTitle">Add Doctor</h3><div class="form-grid"><div><label for="doctorName">Doctor Name</label><input id="doctorName" placeholder="Enter doctor name"></div><div><label for="hq">HQ</label><select id="hq" onchange="loadMarkets()"><option value="">Select HQ</option></select></div><div><label for="market">Market</label><select id="market"><option value="">Select Market</option></select></div></div><div class="actions" style="gap:8px"><button id="doctorSaveButton" class="btn" onclick="saveDoctor()">+ ADD DOCTOR</button><button id="doctorCancelButton" class="small-btn cancel-btn" onclick="cancelDoctorEdit()" hidden>CANCEL</button></div><div class="inline-add"><input id="newMarket" placeholder="Enter new market name"><button class="small-btn" onclick="addMarket()">+ ADD MARKET TO SELECTED HQ</button></div><div id="message" class="message"></div></div>
<div class="card"><h3>Doctor List</h3><div class="filters"><select id="filterHQ" onchange="loadFilterMarkets();loadDoctors()"><option value="">All HQs</option></select><select id="filterMarket" onchange="loadDoctors()"><option value="">All Markets</option></select><input id="search" placeholder="Search doctor" oninput="renderDoctors()"></div><div class="table-wrap"><table><thead><tr><th>Doctor</th><th>HQ</th><th>Market</th><th>Status</th><th>Action</th></tr></thead><tbody id="doctorRows"></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260906-3"></script><script>
let hqs=[],markets=[],doctors=[],editingDoctorId=null;const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className='message '+(e?'error':'success')};
async function init(){const r=await getCurrentUserProfile();if(r.error){location.href='index.html';return}const z=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(z.error){msg(z.error.message,true);return}hqs=z.data||[];hq.innerHTML='<option value="">Select HQ</option>'+hqs.map(x=>`<option value="${x.id}">${esc(x.hq_name)}</option>`).join('');filterHQ.innerHTML='<option value="">All HQs</option>'+hqs.map(x=>`<option value="${x.id}">${esc(x.hq_name)}</option>`).join('');await loadMarkets();await loadFilterMarkets();await loadDoctors()}
async function loadMarkets(){const h=hq.value;let q=client.from('markets').select('id,market_name,hq_id').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const z=await q;if(z.error){msg(z.error.message,true);return}markets=z.data||[];market.innerHTML='<option value="">Select Market</option>'+markets.map(x=>`<option value="${x.id}">${esc(x.market_name)}</option>`).join('')}
async function loadFilterMarkets(){const h=filterHQ.value;let q=client.from('markets').select('id,market_name').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const z=await q;filterMarket.innerHTML='<option value="">All Markets</option>'+(z.data||[]).map(x=>`<option value="${x.id}">${esc(x.market_name)}</option>`).join('')}
async function addMarket(){const h=hq.value,n=newMarket.value.trim();if(!h||!n){msg('Select an HQ and enter a Market Name.',true);return}const z=await client.from('markets').insert({hq_id:h,market_name:n});if(z.error){msg(z.error.message,true);return}newMarket.value='';msg('Market added successfully.');await loadMarkets();market.value=[...market.options].findIndex(o=>o.text===n)>0?[...market.options].find(o=>o.text===n).value:'';await loadFilterMarkets()}
async function saveDoctor(){const name=doctorName.value.trim(),h=hq.value,m=market.value;if(!name||!h||!m){msg('Enter Doctor Name, HQ and Market.',true);return}const chk=await client.from('markets').select('id,hq_id').eq('id',m).single();if(chk.error||chk.data.hq_id!==h){msg('Selected Market does not belong to the selected HQ.',true);return}let duplicateQuery=client.from('doctors').select('id').eq('doctor_name',name).eq('hq_id',h).eq('market_id',m).eq('active',true);if(editingDoctorId)duplicateQuery=duplicateQuery.neq('id',editingDoctorId);const existing=await duplicateQuery.limit(1);if(existing.error){msg(existing.error.message,true);return}if(existing.data?.length){msg('This doctor is already in the master.',true);return}const payload={doctor_name:name,hq_id:h,market_id:m};const z=editingDoctorId?await client.from('doctors').update(payload).eq('id',editingDoctorId):await client.from('doctors').insert(payload);if(z.error){msg(z.error.message,true);return}const wasEditing=Boolean(editingDoctorId);cancelDoctorEdit();msg(wasEditing?'Doctor updated successfully.':'Doctor added successfully.');await loadDoctors()}
async async function editDoctor(id){const d=doctors.find(x=>String(x.id)===String(id));if(!d)return;editingDoctorId=d.id;doctorName.value=d.doctor_name;hq.value=d.hq_id;await loadMarkets();market.value=d.market_id;document.getElementById('doctorFormTitle').textContent='Edit Doctor';document.getElementById('doctorSaveButton').textContent='SAVE CHANGES';document.getElementById('doctorCancelButton').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function cancelDoctorEdit(){editingDoctorId=null;doctorName.value='';hq.value='';market.innerHTML='<option value="">Select Market</option>';document.getElementById('doctorFormTitle').textContent='Add Doctor';document.getElementById('doctorSaveButton').textContent='+ ADD DOCTOR';document.getElementById('doctorCancelButton').hidden=true}
async function deleteDoctor(id){const d=doctors.find(x=>String(x.id)===String(id));if(!d)return;if(!confirm('Permanently delete '+d.doctor_name+'? This cannot be undone.'))return;const z=await client.from('doctors').delete().eq('id',id);if(z.error){msg('Unable to delete doctor: '+z.error.message,true);return}if(String(editingDoctorId)===String(id))cancelDoctorEdit();msg('Doctor deleted successfully.');await loadDoctors()}
async function loadDoctors(){const fh=filterHQ.value,fm=filterMarket.value;let q=client.from('doctors').select('id,doctor_name,hq_id,market_id,active,hqs(hq_name),markets(market_name)').order('doctor_name');if(fh)q=q.eq('hq_id',fh);if(fm)q=q.eq('market_id',fm);const z=await q;if(z.error){msg(z.error.message,true);return}doctors=z.data||[];renderDoctors()}
function renderDoctors(){const s=search.value.toLowerCase();doctorRows.innerHTML=doctors.filter(d=>d.doctor_name.toLowerCase().includes(s)).map(d=>`<tr><td>${esc(d.doctor_name)}</td><td>${esc(d.hqs?.hq_name||'')}</td><td>${esc(d.markets?.market_name||'')}</td><td>${d.active?'Active':'Inactive'}</td><td><div class="row-actions"><button class="small-btn edit-btn" onclick="editDoctor('${d.id}')">Edit</button><button class="small-btn" onclick="toggleDoctor('${d.id}',${d.active})">${d.active?'Deactivate':'Activate'}</button><button class="small-btn delete-btn" onclick="deleteDoctor('${d.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No doctors found.</td></tr>'}
async function toggleDoctor(id,a){const z=await client.from('doctors').update({active:!a}).eq('id',id);if(z.error){msg(z.error.message,true);return}await loadDoctors()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script>
</body></html>
