<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hexadox MIS - Doctor Prescriptions</title><link rel="stylesheet" href="style.css?v=20260906-2"><link rel="stylesheet" href="theme-yellow.css"></head><body><div class="container"><div class="page-top"><h2>MONTHLY DOCTOR PRESCRIPTIONS</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div>
<div class="card"><div class="form-grid"><div><label>Month</label><select id="month"></select></div><div><label>Year</label><select id="year"></select></div><div><label>HQ</label><select id="hq" onchange="loadMarkets();loadDoctors()"></select></div><div><label>Market</label><select id="market" onchange="loadDoctors()"></select></div><div><label>Doctor</label><select id="doctor" onchange="loadExisting()"></select></div></div><div class="actions"><button class="btn secondary" onclick="carryForward()">↻ CARRY FORWARD PREVIOUS MONTH</button></div><div id="info" class="info"></div></div>
<div class="card"><h3>Product-wise Prescription Entry</h3><p class="muted">All products are listed for every doctor and month. Products without prescriptions can remain at 0 Rx.</p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Status</th><th>No. of Rx</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="btn" onclick="saveAll()">SAVE MONTHLY PRESCRIPTIONS</button></div><div id="message" class="message"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260906-2"></script><script>
let hqs=[],markets=[],doctors=[],products=[],rows=[];const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className='message '+(e?'error':'success')};
async function init(){const r=await getCurrentUserProfile();if(r.error){location.href='index.html';return}const now=new Date();document.getElementById('month').innerHTML=months.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===now.getMonth()+1?'selected':''}>${m}</option>`).join('');document.getElementById('year').innerHTML=[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1].map(y=>`<option ${y===now.getFullYear()?'selected':''}>${y}</option>`).join('');const z=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');hqs=z.data||[];document.getElementById('hq').innerHTML='<option value="">Select HQ</option>'+hqs.map(h=>`<option value="${h.id}">${esc(h.hq_name)}</option>`).join('');await loadMarkets();await loadProducts();}
async function loadMarkets(){const h=document.getElementById('hq').value;let q=client.from('markets').select('id,market_name').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const z=await q;markets=z.data||[];document.getElementById('market').innerHTML='<option value="">All Markets</option>'+markets.map(m=>`<option value="${m.id}">${esc(m.market_name)}</option>`).join('');}
async function loadDoctors(){const h=document.getElementById('hq').value,m=document.getElementById('market').value;let q=client.from('doctors').select('id,doctor_name').eq('active',true).order('doctor_name');if(h)q=q.eq('hq_id',h);if(m)q=q.eq('market_id',m);const z=await q;doctors=z.data||[];document.getElementById('doctor').innerHTML='<option value="">Select Doctor</option>'+doctors.map(d=>`<option value="${d.id}">${esc(d.doctor_name)}</option>`).join('');rows=products.map(p=>({product_id:p.id,doctor_status:'Target Dr',rx_count:0}));render();}
async function loadProducts(){const z=await client.from('products').select('id,product_name').order('product_name');products=z.data||[];}

async function loadExisting(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d)return;const z=await client.from('doctor_prescriptions').select('product_id,doctor_status,rx_count').eq('doctor_id',d).eq('month',m).eq('year',y);if(z.error){msg(z.error.message,true);return}const saved=new Map((z.data||[]).map(x=>[String(x.product_id),x]));rows=products.map(p=>({...({product_id:p.id,doctor_status:'Target Dr',rx_count:0}),...(saved.get(String(p.id))||{})}));render()}
function render(){const map=new Map(products.map(p=>[p.id,p.product_name]));rows.sort((a,b)=>(map.get(a.product_id)||'').localeCompare(map.get(b.product_id)||''));document.getElementById('rows').innerHTML=rows.map((r,i)=>`<tr data-i="${i}"><td>${esc(map.get(r.product_id)||'Unknown')}</td><td><select data-f="status"><option ${r.doctor_status==='Prescriber'?'selected':''}>Prescriber</option><option ${r.doctor_status==='Target Dr'?'selected':''}>Target Dr</option></select></td><td><input type="number" step="1" data-f="rx" value="${Number(r.rx_count)||0}"></td></tr>`).join('')||'<tr><td colspan="3">No products found.</td></tr>'}
async function carryForward(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d){msg('Select a doctor first.',true);return}let pm=m-1,py=y;if(pm===0){pm=12;py--}const z=await client.from('doctor_prescriptions').select('product_id,doctor_status').eq('doctor_id',d).eq('month',pm).eq('year',py);if(z.error){msg(z.error.message,true);return}if(!z.data?.length){msg(`No prescription structure found for ${months[pm]} ${py}.`,true);return}const prior=new Map(z.data.map(x=>[String(x.product_id),x]));rows=products.map(p=>({product_id:p.id,doctor_status:prior.get(String(p.id))?.doctor_status||'Target Dr',rx_count:0}));render();document.getElementById('info').textContent=`Carried forward ${rows.length} product entries from ${months[pm]} ${py}. Rx counts were reset to 0.`}
async function saveAll(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d){msg('Select a doctor.',true);return}document.querySelectorAll('#rows tr[data-i]').forEach(tr=>{const i=+tr.dataset.i;rows[i].doctor_status=tr.querySelector('[data-f="status"]').value;rows[i].rx_count=parseInt(tr.querySelector('[data-f="rx"]').value||0,10);});if(!rows.length){msg('No products are available.',true);return}const r=await getCurrentUserProfile();if(r.error){msg(r.error.message,true);return}const payload=rows.map(x=>({doctor_id:d,month:m,year:y,product_id:x.product_id,doctor_status:x.doctor_status,rx_count:x.rx_count,entered_by:r.user.id}));const z=await client.from('doctor_prescriptions').upsert(payload,{onConflict:'doctor_id,month,year,product_id'});if(z.error){msg(z.error.message,true);return}msg('Monthly prescriptions saved successfully.');await loadExisting()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
