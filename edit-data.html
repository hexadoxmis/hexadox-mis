<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6}.back{background:#fff}.container{width:100%;max-width:none;margin:25px auto;padding:0 15px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.toggle .btn{background:#fff;border:1px solid #d0a900}.toggle .active{background:#f4c400}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}select:disabled{background:#eee}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th{background:#f4c400;color:#111;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.addbar{display:flex;gap:10px;margin-bottom:15px}.addbar select{max-width:450px}.remove{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer;font-weight:bold}.newrow{background:#fffdf0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle{flex-direction:column}.addbar{flex-direction:column}.addbar select{max-width:none}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card">
<h3>Edit Existing Data</h3>
<div class="toggle"><button id="salesMode" class="btn active" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="setMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div>
<div id="targetInfo" class="info hidden">For target sheets, select Month, Year and HQ. Stockist is not required.</div>
<div class="grid">
<div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option value="">Select Year</option></select></div>
<div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button></div>
</div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the filters and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="saveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message"></div>
</div>
<script>
const SUPABASE_URL='https://euyqvisqgxuwzcswwiqf.supabase.co';
const SUPABASE_KEY='sb_publishable_4YiBchy04wWSH4K74uXNiw_F0TUILqF';
let client=null;
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Unable to load Supabase library'));document.head.appendChild(s)})}
async function initSupabase(){if(window.supabase?.createClient){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});return true}try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');}catch(e){await loadScript('https://unpkg.com/@supabase/supabase-js@2');}if(!window.supabase?.createClient)throw new Error('Supabase library could not be loaded.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});return true}
let mode='sales',currentHeader=null,salesDetails=[],activeProducts=[],targetRows=[];
const $=id=>document.getElementById(id);
function showMessage(t,type){$('message').className='message '+type;$('message').textContent=t}
function esc(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}
function money(v){return Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function goHome(){location.href='home.html'}
function setLoading(on,text){$('loadButton').disabled=on;if(on)$('loadButton').textContent=text;else $('loadButton').textContent=mode==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET'}
function setMode(m){mode=m;$('salesMode').classList.toggle('active',m==='sales');$('targetMode').classList.toggle('active',m==='targets');$('salesInfo').classList.toggle('hidden',m!=='sales');$('targetInfo').classList.toggle('hidden',m!=='targets');$('stockistBox').classList.toggle('hidden',m==='targets');$('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';$('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';$('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';$('saveArea').classList.add('hidden');if(m==='sales')loadStockists()}
function loadYears(){const s=$('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}
async function loadHQs(){const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error)throw error;$('hq').innerHTML='<option value="">Select HQ</option>';(data||[]).forEach(x=>$('hq').appendChild(new Option(x.hq_name,x.id)))}
async function loadStockists(){const h=$('hq').value,s=$('stockist');s.disabled=true;if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}s.innerHTML='<option>Loading Stockists...</option>';const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error){showMessage('Unable to load stockists: '+error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
async function loadSales(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||!s){showMessage('Please select Month, Year, HQ and Stockist.','error');return}setLoading(true,'Loading submitted sales...');try{const{data:heads,error:he}=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(he)throw he;if(!heads?.length)throw new Error('No submitted sales found for this Month, Year, HQ and Stockist.');currentHeader=heads[0];const{data:rows,error:de}=await client.from('sales_entry_details').select('id,product_id,pts,primary_pts,secondary_pts,primary_units,secondary_units,products(product_name)').eq('entry_id',currentHeader.id).order('id');if(de)throw de;salesDetails=rows||[];const{data:prods,error:pe}=await client.from('products').select('id,product_name,price_apr_2026,price_may_2026,price_jun_2026,price_jul_2026,price_aug_2026,price_sep_2026,price_oct_2026,price_nov_2026,price_dec_2026,price_jan_2027,price_feb_2027,price_mar_2027').order('product_name');if(pe)throw pe;activeProducts=prods||[];const saved=new Map(salesDetails.map(r=>[String(r.product_id),r]));salesDetails=activeProducts.map(p=>saved.get(String(p.id))||({id:null,product_id:p.id,pts:0,primary_pts:0,secondary_pts:0,primary_units:0,secondary_units:0,products:{product_name:p.product_name}})).concat([...saved.entries()].filter(([id])=>!activeProducts.some(p=>String(p.id)===id)).map(([,r])=>r));renderSales()}catch(e){$('productArea').innerHTML='<div class="message error">'+esc(e.message)+'</div>'}finally{setLoading(false)}}
function updateEditSalesTotals(){let pu=0,pv=0,su=0,sv=0;document.querySelectorAll('#productArea tr[data-id]').forEach(r=>{const pp=+r.querySelector('[data-f="primary_pts"]').value||0,p=+r.querySelector('[data-f="primary_units"]').value||0,sp=+r.querySelector('[data-f="secondary_pts"]').value||0,s=+r.querySelector('[data-f="secondary_units"]').value||0;pu+=p;pv+=pp*p;su+=s;sv+=sp*s});const a=document.querySelector('.edit-total-primary-units'),b=document.querySelector('.edit-total-primary'),c=document.querySelector('.edit-total-secondary-units'),d=document.querySelector('.edit-total-secondary');if(a)a.textContent=pu.toLocaleString('en-IN');if(b)b.textContent=money(pv);if(c)c.textContent=su.toLocaleString('en-IN');if(d)d.textContent=money(sv)}
function renderSales(){let html='<div class="info">Primary and Secondary PTS are independent. Values are calculated using the corresponding PTS × units. Changes are permanent only after SAVE CHANGES.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Primary PTS</th><th>Primary Units</th><th>Primary Value</th><th>Secondary PTS</th><th>Secondary Units</th><th>Secondary Value</th></tr></thead><tbody>';salesDetails.forEach((r,i)=>{const id=r.id||'new_'+r.product_id,pp=Number(r.primary_pts??r.pts)||0,sp=Number(r.secondary_pts??r.pts)||0;html+='<tr data-id="'+id+'" data-product="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+esc(r.products?.product_name||'')+'</td><td><input type="number" step="0.01" data-f="primary_pts" value="'+pp+'"></td><td><input type="number" step="1" data-f="primary_units" value="'+(r.primary_units??0)+'"></td><td class="value pv">'+money(pp*(Number(r.primary_units)||0))+'</td><td><input type="number" step="0.01" data-f="secondary_pts" value="'+sp+'"></td><td><input type="number" step="1" data-f="secondary_units" value="'+(r.secondary_units??0)+'"></td><td class="value sv">'+money(sp*(Number(r.secondary_units)||0))+'</td></tr>'});html+='<tfoot><tr class="total"><td colspan="3">TOTAL</td><td class="edit-total-primary-units">0</td><td class="edit-total-primary">0.00</td><td></td><td class="edit-total-secondary-units">0</td><td class="edit-total-secondary">0.00</td></tr></tfoot></tbody></table></div>';$('productArea').innerHTML=html;updateEditSalesTotals();$('saveArea').classList.remove('hidden');document.querySelectorAll('#productArea tr[data-id] input').forEach(inp=>inp.addEventListener('input',()=>{const r=inp.closest('tr'),pp=+r.querySelector('[data-f="primary_pts"]').value||0,pu=+r.querySelector('[data-f="primary_units"]').value||0,sp=+r.querySelector('[data-f="secondary_pts"]').value||0,su=+r.querySelector('[data-f="secondary_units"]').value||0;r.querySelector('.pv').textContent=money(pp*pu);r.querySelector('.sv').textContent=money(sp*su);updateEditSalesTotals()}))}
async function saveSales(){if(!currentHeader)return;const b=$('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];document.querySelectorAll('#productArea tr[data-id]').forEach(tr=>{const id=tr.dataset.id;const val=f=>tr.querySelector('[data-f="'+f+'"]').value;const pp=parseFloat(val('primary_pts'))||0,sp=parseFloat(val('secondary_pts'))||0,pu=parseInt(val('primary_units'),10)||0,su=parseInt(val('secondary_units'),10)||0;if(!Number.isInteger(pu)||!Number.isInteger(su))throw new Error('Invalid values for '+tr.querySelector('.product').textContent);desired.push({id:id.startsWith('new_')?null:id,product_id:tr.dataset.product,primary_pts:pp,secondary_pts:sp,primary_units:pu,secondary_units:su})});const keep=new Set();for(const r of desired){if(r.id){keep.add(String(r.id));const{error}=await client.from('sales_entry_details').update({primary_pts:r.primary_pts,secondary_pts:r.secondary_pts,primary_units:r.primary_units,secondary_units:r.secondary_units,pts:r.primary_pts}).eq('id',r.id).eq('entry_id',currentHeader.id);if(error)throw error}else{const{data,error}=await client.from('sales_entry_details').insert({entry_id:currentHeader.id,product_id:r.product_id,pts:r.primary_pts,primary_pts:r.primary_pts,secondary_pts:r.secondary_pts,primary_units:r.primary_units,secondary_units:r.secondary_units}).select('id').single();if(error)throw error;if(data?.id)keep.add(String(data.id))}}const{data:old,error:oe}=await client.from('sales_entry_details').select('id').eq('entry_id',currentHeader.id);if(oe)throw oe;for(const r of old||[]){if(!keep.has(String(r.id))){const{error}=await client.from('sales_entry_details').delete().eq('id',r.id).eq('entry_id',currentHeader.id);if(error)throw error}}showMessage('Saved successfully. Primary and Secondary PTS and quantities have been updated.','success');await loadSales()}catch(e){showMessage('Unable to update submitted sales: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
async function loadTargets(){const m=+$('month').value,y=+$('year').value,h=$('hq').value;if(!m||!y||!h){showMessage('Please select Month, Year and HQ.','error');return}setLoading(true,'Loading target sheet...');try{const{data:prods,error:pe}=await client.from('products').select('id,product_name,price_apr_2026,price_may_2026,price_jun_2026,price_jul_2026,price_aug_2026,price_sep_2026,price_oct_2026,price_nov_2026,price_dec_2026,price_jan_2027,price_feb_2027,price_mar_2027').order('product_name');if(pe)throw pe;activeProducts=prods||[];const{data:rows,error:te}=await client.from('targets').select('id,product_id,target_units').eq('month',m).eq('year',y).eq('hq_id',h);if(te)throw te;targetRows=rows||[];renderTargets()}catch(e){$('productArea').innerHTML='<div class="message error">'+esc(e.message)+'</div>'}finally{setLoading(false)}}
function renderTargets(){const map={};targetRows.forEach(r=>map[r.product_id]=r);let html='<div class="info">All products remain listed. Leave Target Units at 0 for products without a target.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Target Units</th></tr></thead><tbody>';activeProducts.forEach((p,i)=>html+='<tr><td>'+(i+1)+'</td><td class="product">'+esc(p.product_name)+'</td><td><input type="number" step="1" class="target" data-product="'+p.id+'" value="'+(map[p.id]?.target_units??0)+'"></td></tr>');html+='</tbody></table></div>';$('productArea').innerHTML=html;$('saveArea').classList.remove('hidden')}
async function saveTargets(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,b=$('saveButton');b.disabled=true;b.textContent='SAVING...';try{const desired=[];document.querySelectorAll('.target').forEach(x=>{const u=x.value.trim()===''?0:parseInt(x.value,10);if(!Number.isInteger(u))throw new Error('Invalid target units');desired.push({product_id:x.dataset.product,target_units:u})});for(const r of desired){const{data:ex,error:qe}=await client.from('targets').select('id').eq('month',m).eq('year',y).eq('hq_id',h).eq('product_id',r.product_id).limit(1);if(qe)throw qe;const result=ex?.length?await client.from('targets').update({target_pts:0,target_units:r.target_units}).eq('id',ex[0].id):await client.from('targets').insert({month:m,year:y,hq_id:h,product_id:r.product_id,target_pts:0,target_units:r.target_units});if(result.error)throw result.error}const{data:all,error:ae}=await client.from('targets').select('id,product_id').eq('month',m).eq('year',y).eq('hq_id',h);if(ae)throw ae;const keep=new Set(desired.map(r=>String(r.product_id)));for(const r of all||[]){if(!keep.has(String(r.product_id))){const{error}=await client.from('targets').delete().eq('id',r.id);if(error)throw error}}showMessage('Target sheet saved successfully.','success');await loadTargets()}catch(e){showMessage('Unable to update target sheet: '+e.message,'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
async function loadCurrentData(){if(mode==='sales')await loadSales();else await loadTargets()}
async function saveCurrentData(){if(mode==='sales')await saveSales();else await saveTargets()}
async function init(){try{await initSupabase();const{data,error}=await client.auth.getSession();if(error)throw error;if(!data?.session){location.href='index.html';return}loadYears();const d=new Date();$('month').value=d.getMonth()+1;$('year').value=d.getFullYear();await loadHQs()}catch(e){$('productArea').innerHTML='<div class="message error">Supabase initialization failed: '+esc(e.message)+'</div>';console.error(e)}}
$('hq').addEventListener('change',()=>{if(mode==='sales')loadStockists()});
init();
</script>
</body>
</html>
