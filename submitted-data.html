<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hexadox MIS - Submitted Data</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#F6F3EC;color:#1557A6}
.header{background:#FFFFFF;color:#1557A6;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #1557A6}.header h2{margin:0;font-size:22px;color:#1557A6}
.back{background:#1557A6;color:#fff;padding:9px 16px;border-radius:6px;text-decoration:none;font-weight:bold}
.container{width:100%;max-width:none;margin:24px auto;padding:0 15px}.card{background:#FFFFFF;padding:22px;border-radius:10px;box-shadow:0 2px 10px #28303c1f;margin-bottom:20px}
.card h3{margin:0 0 18px;color:#1557A6}.toggle{display:flex;gap:10px;margin-bottom:20px}.toggle a{padding:10px 18px;border:1px solid #1557A6;border-radius:6px;text-decoration:none;color:#1557A6;font-weight:bold}.toggle a.active{background:#1557A6;color:#fff}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}label{display:block;font-weight:bold;margin-bottom:7px;color:#1557A6}select{width:100%;padding:10px;border:1px solid #C9C4BA;border-radius:5px;font-size:15px;background:#FBFAF6;color:#1557A6}
.search{text-align:center;margin-top:20px}.search button{background:#1557A6;color:#fff;border:0;padding:12px 45px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer}
.loading{text-align:center;padding:25px;color:#1557A6;font-weight:bold}.table-wrap{overflow-x:auto}table{width:100%;min-width:900px;border-collapse:collapse}th{background:#1557A6;color:#fff;padding:11px}td{padding:8px;border-bottom:1px solid #D7D2C8;text-align:right;color:#1557A6}td:first-child{text-align:left}.total{font-weight:bold;background:#EAF2FB;color:#1557A6}.abm{font-weight:bold;background:#FCEAE8;color:#B42318}
@media(max-width:800px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.filters{grid-template-columns:1fr}.header h2{font-size:17px}.container{margin-top:12px}.toggle{flex-direction:column}}
</style>
</head>
<body>
<div class="header"><h2>HEXADOX MIS — SUBMITTED DATA</h2><a class="back" href="home.html?v=20260903-3">HOME</a></div>
<div class="container">
<div class="card">
<h3>Find Submission</h3>
<div class="toggle"><a id="salesTab" href="submitted-data.html?v=20260903-3&view=sales">SUBMITTED SALES</a><a id="targetTab" href="submitted-data.html?v=20260903-3&view=targets">SUBMITTED TARGETS</a></div>
<div class="filters">
<div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option>2024</option><option>2025</option><option>2026</option><option>2027</option></select></div>
<div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div>
<div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div>
</div>
<div class="search"><button onclick="runSearch()">SEARCH</button></div>
</div>
<div class="card"><div id="result" class="loading">Select filters and click SEARCH.</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// This page intentionally initializes Supabase locally instead of depending on app.js.
// That prevents the Submitted Data page from failing when app.js is cached or unavailable.
const supabaseUrl="https://euyqvisqgxuwzcswwiqf.supabase.co";
const supabaseKey="sb_publishable_4YiBchy04wWSH4K74uXNiw_F0TUILqF";
const client=window.supabase.createClient(supabaseUrl,supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const view=new URLSearchParams(location.search).get('view')==='targets'?'targets':'sales';
const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
const n=v=>(Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const money=v=>(Number(v)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
function showError(msg){$('result').className='loading';$('result').style.color='#B42318';$('result').textContent=msg}
function setDefaults(){$('year').value=String(new Date().getFullYear());$('month').value=String(new Date().getMonth()+1);$('salesTab').classList.toggle('active',view==='sales');$('targetTab').classList.toggle('active',view==='targets');$('stockistBox').style.display=view==='targets'?'none':'block'}
async function init(){try{const{data,error}=await client.auth.getSession();if(error||!data.session){location.href='index.html';return}setDefaults();await loadHQ();if(view==='sales')await loadStockists()}catch(e){showError('Unable to initialize: '+(e.message||e))}}
async function loadHQ(){const{data,error}=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(error)throw error;$('hq').innerHTML='<option value="">Select HQ</option><option value="ALL">All HQs</option>';(data||[]).forEach(x=>$('hq').appendChild(new Option(x.hq_name,x.id)))}
$('hq').addEventListener('change',()=>{if(view==='sales')loadStockists().catch(e=>showError(e.message||e))});
async function loadStockists(){const h=$('hq').value,s=$('stockist');s.disabled=true;s.innerHTML='<option>Loading Stockists...</option>';if(!h||h==='ALL'){s.innerHTML='<option value="">Select Stockist</option>';return}const{data,error}=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(error)throw error;s.innerHTML='<option value="">Select Stockist</option>';(data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
function runSearch(){view==='targets'?searchTargets():searchSales()}
async function searchSales(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||h==='ALL'||!s){showError('Please select Month, Year, HQ and Stockist.');return}const area=$('result');area.className='loading';area.style.color='#1557A6';area.textContent='Searching...';try{
const{data:heads,error:headError}=await client.from('sales_entry_header').select('id').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(headError)throw headError;if(!heads?.length){area.textContent='No submitted data found.';return}
const{data:details,error:detailError}=await client.from('sales_entry_details').select('product_id,pts,primary_pts,secondary_pts,primary_units,secondary_units,primary_value,secondary_value').eq('entry_id',heads[0].id);if(detailError)throw detailError;
const[{data:products,error:productError},{data:hq,error:hqError},{data:stk,error:stockistError}]=await Promise.all([client.from('products').select('id,product_name').order('product_name'),client.from('hqs').select('hq_name').eq('id',h).single(),client.from('stockists').select('stockist_name').eq('id',s).single()]);if(productError)throw productError;if(hqError)throw hqError;if(stockistError)throw stockistError;
const map={};(products||[]).forEach(p=>map[p.id]=p.product_name);const saved=new Map((details||[]).map(x=>[String(x.product_id),x]));const rows=(products||[]).map(p=>saved.get(String(p.id))||({product_id:p.id,pts:0,primary_pts:0,secondary_pts:0,primary_units:0,secondary_units:0})).sort((a,b)=>(map[a.product_id]||'').localeCompare(map[b.product_id]||'','en',{numeric:true,sensitivity:'base'}));let puTotal=0,suTotal=0,pv=0,sv=0;
let html='<h3>Submitted Sales</h3><p><b>'+months[m]+' '+y+'</b> | '+esc(hq.hq_name)+' | '+esc(stk.stockist_name)+'</p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Primary PTS</th><th>Primary Qty</th><th>Primary Value</th><th>Secondary PTS</th><th>Secondary Qty</th><th>Secondary Value</th></tr></thead><tbody>';
rows.forEach(d=>{const pp=Number(d.primary_pts??d.pts)||0,sp=Number(d.secondary_pts??d.pts)||0,p=pp*(Number(d.primary_units)||0),s2=sp*(Number(d.secondary_units)||0);puTotal+=Number(d.primary_units)||0;suTotal+=Number(d.secondary_units)||0;pv+=p;sv+=s2;html+='<tr><td>'+esc(map[d.product_id]||'Unknown')+'</td><td>'+pp.toFixed(2)+'</td><td>'+n(d.primary_units)+'</td><td>'+money(p)+'</td><td>'+sp.toFixed(2)+'</td><td>'+n(d.secondary_units)+'</td><td>'+money(s2)+'</td></tr>'});
html+='<tr class="total"><td>TOTAL</td><td></td><td>'+n(puTotal)+'</td><td>'+money(pv)+'</td><td></td><td>'+n(suTotal)+'</td><td>'+money(sv)+'</td></tr></tbody></table></div>';area.className='';area.style.color='';area.innerHTML=html;
}catch(e){showError(e.message||String(e))}}
async function searchTargets(){const m=+$('month').value,y=+$('year').value,h=$('hq').value;if(!m||!y||!h){showError('Please select Month, Year and HQ.');return}const area=$('result');area.className='loading';area.style.color='#1557A6';area.textContent='Loading target sheets...';try{if(h==='ALL'){await allTargets(m,y);return}
const{data:targets,error:targetError}=await client.from('targets').select('product_id,target_units').eq('month',m).eq('year',y).eq('hq_id',h);if(targetError)throw targetError;
const[{data:products,error:productError},{data:hq,error:hqError}]=await Promise.all([client.from('products').select('id,product_name').order('product_name'),client.from('hqs').select('hq_name').eq('id',h).single()]);if(productError)throw productError;if(hqError)throw hqError;const map={};(products||[]).forEach(p=>map[p.id]=p.product_name);let total=0;
let html='<h3>Submitted Target Sheet</h3><p><b>'+months[m]+' '+y+'</b> | '+esc(hq.hq_name)+'</p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Target Units</th></tr></thead><tbody>';
(products||[]).sort((a,b)=>a.product_name.localeCompare(b.product_name,'en',{numeric:true})).forEach(p=>{const u=+(targets.find(t=>String(t.product_id)===String(p.id))?.target_units)||0;total+=u;html+='<tr><td>'+esc(p.product_name)+'</td><td>'+n(u)+'</td></tr>'});html+='<tr class="total"><td>TOTAL</td><td>'+n(total)+'</td></tr></tbody></table></div>';area.className='';area.style.color='';area.innerHTML=html;
}catch(e){showError(e.message||String(e))}}
async function allTargets(m,y){const{data:targets,error}=await client.from('targets').select('product_id,target_units').eq('month',m).eq('year',y);if(error)throw error;const{data:products,error:productError}=await client.from('products').select('id,product_name').order('product_name');if(productError)throw productError;const map={};(products||[]).forEach(p=>map[p.id]=p.product_name);const grouped={};targets.forEach(t=>grouped[t.product_id]=(grouped[t.product_id]||0)+(Number(t.target_units)||0));let total=0;let html='<h3>Submitted Targets — All HQs</h3><p><b>'+months[m]+' '+y+'</b> | <b>Cumulative ABM Target</b></p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Cumulative Target Units</th></tr></thead><tbody>';(products||[]).sort((a,b)=>a.product_name.localeCompare(b.product_name,'en',{numeric:true})).forEach(p=>{const u=grouped[p.id]||0;total+=u;html+='<tr><td>'+esc(p.product_name)+'</td><td>'+n(u)+'</td></tr>'});html+='<tr class="abm"><td>ABM TOTAL</td><td>'+n(total)+'</td></tr></tbody></table></div>';$('result').className='';$('result').style.color='';$('result').innerHTML=html}
init();
</script>
</body>
</html>
