<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Doctor Product Mapping Analytics</title>
<link rel="stylesheet" href="style.css?v=20260906-5"><link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#222;font-family:Arial,sans-serif}.container{width:100%;max-width:none;margin:0 auto;padding:24px 28px 50px}.page-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;padding:16px 20px;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);border-left:5px solid #f0c419}.page-top h2{margin:0;font-size:24px;letter-spacing:.4px}.back-button{min-width:110px;background:#fff;color:#222;border:1px solid #ddd;padding:10px 20px;border-radius:7px;cursor:pointer;font-weight:700}.card{background:#fff;border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.07)}.card h3{margin:0 0 16px;font-size:18px;padding-bottom:12px;border-bottom:1px solid #eee}.filter-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:13px;align-items:end}label{display:block;font-size:13px;font-weight:700;color:#555;margin:0 0 7px}input,select{width:100%;height:42px;padding:9px 11px;border:1px solid #d5d9dc;border-radius:7px;background:#fff;color:#222;font-size:14px}.actions{margin-top:18px;display:flex;justify-content:flex-end}.btn{height:42px;padding:0 22px;border:0;border-radius:7px;background:#f0c419;color:#222;font-weight:700;cursor:pointer;min-width:220px}.message{min-height:20px;margin-top:12px;font-size:13px;font-weight:600}.message.success{color:#2e7d32}.message.error{color:#c62828}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.kpi{padding:15px;border:1px solid #e5e7e9;border-radius:9px;background:#fafafa}.kpi span{display:block;font-size:12px;color:#666;margin-bottom:8px}.kpi b{font-size:21px}.muted{color:#666;font-size:13px;line-height:1.5;margin:12px 0 0}.table-wrap{width:100%;overflow-x:auto;border:1px solid #e4e6e8;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:950px}th{background:#292929;color:#fff;font-size:12px;padding:11px 10px;text-align:left;white-space:nowrap}td{padding:11px 10px;border-top:1px solid #eee;font-size:13px;vertical-align:middle}tbody tr:hover{background:#fffdf0}.num{text-align:right;font-variant-numeric:tabular-nums}.empty{text-align:center;color:#666;padding:24px}.achievement{font-weight:700}.positive{color:#18764b}.bar{height:6px;background:#e8ebee;border-radius:5px;overflow:hidden;margin-top:5px;min-width:72px}.bar i{display:block;height:100%;background:#35a274;border-radius:5px}.small{font-size:11px;color:#6b7280}
@media(max-width:1150px){.filter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.container{padding:16px 14px 35px}.page-top h2{font-size:19px}.filter-grid,.kpi-grid{grid-template-columns:1fr 1fr}.actions{justify-content:stretch}.btn{width:100%}}@media(max-width:460px){.filter-grid,.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="container">
<div class="page-top"><h2>DOCTOR PRODUCT MAPPING ANALYTICS</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div>
<div class="card"><h3>Analysis filters</h3><div class="filter-grid">
<div><label for="startMonth">Start Month</label><select id="startMonth"></select></div><div><label for="endMonth">End Month</label><select id="endMonth"></select></div><div><label for="year">Year</label><select id="year"></select></div><div><label for="hq">HQ</label><select id="hq"></select></div><div><label for="market">Market</label><select id="market"></select></div><div><label for="product">Product</label><select id="product"></select></div><div><label for="mappingStatus">Status</label><select id="mappingStatus"><option value="">All Statuses</option><option>Prescriber</option><option>Target Dr</option></select></div>
</div><div class="actions"><button id="generate" class="btn">GENERATE ANALYSIS</button></div><div id="message" class="message"></div></div>
<div id="report"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260906-5"></script>
<script>
const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];let hqs=[],markets=[],products=[];const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(t,e){$('message').textContent=t;$('message').className='message '+(e?'error':'success')}
async function init(){const user=await getCurrentUserProfile();if(user.error||!user.profile){location.href='index.html';return}if(user.profile.role!=='Admin'&&user.profile.role!=='ABM'){document.querySelector('.container').innerHTML='<div class="card">Access denied. Administrator or ABM permission is required.</div>';return}const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;$('startMonth').innerHTML=months.slice(1).map((m,i)=>'<option value="'+(i+1)+'" '+(i+1===1?'selected':'')+'>'+m+'</option>').join('');$('endMonth').innerHTML=months.slice(1).map((m,i)=>'<option value="'+(i+1)+'" '+(i+1===cm?'selected':'')+'>'+m+'</option>').join('');$('year').innerHTML=[cy-1,cy,cy+1].map(y=>'<option value="'+y+'" '+(y===cy?'selected':'')+'>'+y+'</option>').join('');const h=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(h.error){msg(h.error.message,true);return}hqs=h.data||[];$('hq').innerHTML='<option value="">All HQs</option>'+hqs.map(x=>'<option value="'+x.id+'">'+esc(x.hq_name)+'</option>').join('');const p=await client.from('products').select('id,product_name').eq('active',true).order('product_name');if(p.error){msg(p.error.message,true);return}products=p.data||[];$('product').innerHTML='<option value="">All Products</option>'+products.map(x=>'<option value="'+x.id+'">'+esc(x.product_name)+'</option>').join('');$('hq').addEventListener('change',loadMarkets);await loadMarkets()}
async function loadMarkets(){const h=$('hq').value;let q=client.from('markets').select('id,market_name,hq_id').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);const r=await q;if(r.error){msg(r.error.message,true);return}markets=r.data||[];$('market').innerHTML='<option value="">All Markets</option>'+markets.map(x=>'<option value="'+x.id+'">'+esc(x.market_name)+'</option>').join('')}
function key(h,p){return String(h)+'|'+String(p)}
async function generate(){const sm=+$('startMonth').value,em=+$('endMonth').value,y=+$('year').value,h=$('hq').value,marketId=$('market').value,productId=$('product').value,status=$('mappingStatus').value;if(sm>em){msg('Start Month cannot be after End Month.',true);return}const monthCount=em-sm+1;msg('Generating analysis...',false);$('report').innerHTML='';try{
let dq=client.from('doctors').select('id,doctor_name,hq_id,market_id').eq('active',true);if(h)dq=dq.eq('hq_id',h);if(marketId)dq=dq.eq('market_id',marketId);const dr=await dq;if(dr.error)throw dr.error;const doctors=dr.data||[],doctorById=new Map(doctors.map(d=>[String(d.id),d])),doctorIds=doctors.map(d=>d.id),selectedMarket=markets.find(x=>String(x.id)===String(marketId)),hqIds=h?[h]:(selectedMarket?[selectedMarket.hq_id]:hqs.map(x=>x.id)),productById=new Map(products.map(x=>[String(x.id),x.product_name]));
let prescriptionRows=[];if(doctorIds.length){let q=client.from('doctor_prescriptions').select('doctor_id,product_id,month,year,doctor_status,rx_count,current_avg_rx,target_avg_rx').gte('month',sm).lte('month',em).eq('year',y).in('doctor_id',doctorIds);if(productId)q=q.eq('product_id',productId);if(status)q=q.eq('doctor_status',status);const r=await q;if(r.error)throw r.error;prescriptionRows=r.data||[]}
const secondary=new Map(),secondaryTarget=new Map();if(hqIds.length){let q=client.from('sales_entry_header').select('id,hq_id,month').gte('month',sm).lte('month',em).eq('year',y).in('hq_id',hqIds);const heads=await q;if(heads.error)throw heads.error;const headerById=new Map((heads.data||[]).map(x=>[String(x.id),x]));if(headerById.size){let d=client.from('sales_entry_details').select('entry_id,product_id,secondary_units').in('entry_id',Array.from(headerById.keys()));if(productId)d=d.eq('product_id',productId);const details=await d;if(details.error)throw details.error;(details.data||[]).forEach(x=>{const head=headerById.get(String(x.entry_id));if(!head)return;const k=key(head.hq_id,x.product_id),v=secondary.get(k)||{units:0,months:new Set()};v.units+=Number(x.secondary_units)||0;v.months.add(Number(head.month));secondary.set(k,v)})}
let tq=client.from('targets').select('hq_id,product_id,month,target_units').eq('year',y).gte('month',sm).lte('month',em).in('hq_id',hqIds);if(productId)tq=tq.eq('product_id',productId);const tr=await tq;if(tr.error)throw tr.error;(tr.data||[]).forEach(x=>{const k=key(x.hq_id,x.product_id);secondaryTarget.set(k,(secondaryTarget.get(k)||0)+(Number(x.target_units)||0))})}
const planByProduct=new Map(),doctorPlan=new Map();prescriptionRows.forEach(x=>{const doc=doctorById.get(String(x.doctor_id));if(!doc)return;const k=key(doc.hq_id,x.product_id),g=planByProduct.get(k)||{hqId:doc.hq_id,productId:x.product_id,doctors:new Set(),current:0,target:0,rx:0,months:new Set()};g.doctors.add(String(x.doctor_id));g.current+=Number(x.current_avg_rx)||0;g.target+=Number(x.target_avg_rx)||0;g.rx+=Number(x.rx_count)||0;g.months.add(Number(x.month));planByProduct.set(k,g);const dk=String(x.doctor_id)+'|'+String(x.product_id),dg=doctorPlan.get(dk)||{doctor:doc,productId:x.product_id,statuses:new Set(),current:0,target:0,rx:0,months:new Set()};dg.statuses.add(x.doctor_status);dg.current+=Number(x.current_avg_rx)||0;dg.target+=Number(x.target_avg_rx)||0;dg.rx+=Number(x.rx_count)||0;dg.months.add(Number(x.month));doctorPlan.set(dk,dg)});
const keys=new Set([...secondary.keys(),...secondaryTarget.keys(),...planByProduct.keys()]);let productRows=Array.from(keys).map(k=>{const bits=k.split('|'),hqId=bits[0],pid=bits[1],sales=secondary.get(k)||{units:0},g=planByProduct.get(k)||{doctors:new Set(),current:0,target:0,rx:0};const targetUnits=secondaryTarget.get(k)||0;return{hq:hqs.find(x=>String(x.id)===String(hqId))?.hq_name||'—',hqId:hqId,product:productById.get(String(pid))||'Unknown product',productId:pid,doctors:g.doctors.size,current:g.current/monthCount,target:g.target/monthCount,secondary:sales.units,targetUnits:targetUnits,achievement:targetUnits?sales.units/targetUnits*100:null,conversion:g.target?sales.units/g.target*100:null}});if(productId)productRows=productRows.filter(x=>x.productId===productId);productRows.sort((a,b)=>a.hq.localeCompare(b.hq)||a.product.localeCompare(b.product));
const doctorRows=Array.from(doctorPlan.values()).map(g=>({doctor:g.doctor.doctor_name||'—',hq:hqs.find(x=>String(x.id)===String(g.doctor.hq_id))?.hq_name||'—',product:productById.get(String(g.productId))||'Unknown product',status:g.statuses.size===1?Array.from(g.statuses)[0]:'Mixed',rx:g.rx/monthCount,current:g.current/monthCount,target:g.target/monthCount,progress:g.target?g.current/g.target*100:null})).sort((a,b)=>a.hq.localeCompare(b.hq)||a.doctor.localeCompare(b.doctor)||a.product.localeCompare(b.product));
const secondaryTotal=productRows.reduce((a,x)=>a+x.secondary,0),targetTotal=productRows.reduce((a,x)=>a+x.targetUnits,0),currentPlan=productRows.reduce((a,x)=>a+x.current,0),targetPlan=productRows.reduce((a,x)=>a+x.target,0),overallAch=targetTotal?secondaryTotal/targetTotal*100:null,overallRx=targetPlan?currentPlan/targetPlan*100:null;
let html='<div class="kpi-grid"><div class="kpi"><span>Secondary Units</span><b>'+fmt(secondaryTotal)+'</b></div><div class="kpi"><span>Product Target Units</span><b>'+fmt(targetTotal)+'</b></div><div class="kpi"><span>Product Secondary Achievement</span><b>'+(overallAch===null?'—':fmt(overallAch)+'%')+'</b></div><div class="kpi"><span>Mapped Rx Plan Progress</span><b>'+(overallRx===null?'—':fmt(overallRx)+'%')+'</b></div></div>';
html+='<div class="card"><h3>Product-wise Secondary Achievement and Mapped Plan</h3><div class="table-wrap"><table><thead><tr><th>HQ</th><th>Product</th><th class="num">Mapped Doctors</th><th class="num">Current Avg Rx Plan / Month</th><th class="num">Target Avg Rx Plan / Month</th><th class="num">Secondary Units</th><th class="num">Target Units</th><th class="num">Secondary Achievement</th><th class="num">Secondary / Mapped Rx Plan</th></tr></thead><tbody>';
html+=productRows.map(x=>'<tr><td>'+esc(x.hq)+'</td><td>'+esc(x.product)+'</td><td class="num">'+x.doctors+'</td><td class="num">'+fmt(x.current)+'</td><td class="num">'+fmt(x.target)+'</td><td class="num">'+fmt(x.secondary)+'</td><td class="num">'+fmt(x.targetUnits)+'</td><td class="num achievement">'+(x.achievement===null?'—':fmt(x.achievement)+'%')+'</td><td class="num">'+(x.conversion===null?'—':fmt(x.conversion)+'%')+'</td></tr>').join('')||'<tr><td colspan="9" class="empty">No secondary, target, or mapping data found for these filters.</td></tr>';
html+='</tbody></table></div><p class="muted">Secondary achievement = secondary units ÷ product target units. Secondary / mapped Rx plan = secondary units ÷ summed target average prescriptions across mapped doctors and selected months. Secondary is recorded by stockist and HQ, so this comparison is shown once per HQ and product.</p></div>';
html+='<div class="card"><h3>Mapped Doctor Prescription Plan</h3><div class="table-wrap"><table><thead><tr><th>HQ</th><th>Doctor</th><th>Product</th><th>Status</th><th class="num">Avg Prescriptions / Month</th><th class="num">Current Avg Rx Plan</th><th class="num">Target Avg Rx Plan</th><th class="num">Plan Progress</th></tr></thead><tbody>';
html+=doctorRows.map(x=>'<tr><td>'+esc(x.hq)+'</td><td>'+esc(x.doctor)+'</td><td>'+esc(x.product)+'</td><td>'+esc(x.status)+'</td><td class="num">'+fmt(x.rx)+'</td><td class="num">'+fmt(x.current)+'</td><td class="num">'+fmt(x.target)+'</td><td class="num achievement">'+(x.progress===null?'—':fmt(x.progress)+'%')+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">No mapped doctor prescriptions found for these filters.</td></tr>';
html+='</tbody></table></div><p class="muted">Selected period: '+months[sm]+'–'+months[em]+' '+y+' ('+monthCount+' month'+(monthCount===1?'':'s')+'). Doctor-level rows compare prescriptions with that doctor’s mapped average Rx plan. Secondary sales are not assigned to individual doctors in the MIS data.</p></div>';$('report').innerHTML=html;msg('Analysis generated successfully.',false)
}catch(e){console.error(e);msg(e.message||'Unable to generate analysis.',true)}}
$('generate').addEventListener('click',generate);init();
</script></body></html>
