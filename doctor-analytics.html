<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hexadox MIS - Doctor Analytics</title>
<link rel="stylesheet" href="style.css?v=20260906-5">
<link rel="stylesheet" href="theme-yellow.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f7;color:#222;font-family:Arial,sans-serif}
.container{width:100%;max-width:none;margin:0 auto;padding:24px 28px 50px}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;padding:16px 20px;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);border-left:5px solid #f0c419}
.page-top h2{margin:0;font-size:24px;letter-spacing:.4px;color:#222}
.back-button{min-width:110px;background:#fff;color:#222;border:1px solid #ddd;padding:10px 20px;border-radius:7px;cursor:pointer;font-weight:700}
.card{background:#fff;border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.card h3{margin:0 0 18px;font-size:18px;color:#333;padding-bottom:12px;border-bottom:1px solid #eee}
.filter-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end}
label{display:block;font-size:13px;font-weight:700;color:#555;margin:0 0 7px}
input,select{width:100%;height:42px;padding:9px 11px;border:1px solid #d5d9dc;border-radius:7px;background:#fff;color:#222;font-size:14px}
input:focus,select:focus{outline:none;border-color:#d6ad00;box-shadow:0 0 0 2px rgba(240,196,25,.18)}
.actions{margin-top:20px;display:flex;justify-content:flex-end}
.btn{height:42px;padding:0 22px;border:0;border-radius:7px;background:#f0c419;color:#222;font-weight:700;cursor:pointer;min-width:220px}
.btn:hover{filter:brightness(.97)}
.message{min-height:20px;margin-top:12px;font-size:13px;font-weight:600}.message.success{color:#2e7d32}.message.error{color:#c62828}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px;border:1px solid #e5e7e9;border-radius:9px;background:#fafafa;min-height:82px}
.kpi span{display:block;font-size:12px;color:#666;margin-bottom:9px}.kpi b{font-size:22px;color:#222}
.muted{color:#666;font-size:13px;line-height:1.5;margin:15px 0 0}
.table-wrap{width:100%;overflow-x:auto;border:1px solid #e4e6e8;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:#292929;color:#fff;font-size:13px;padding:11px 12px;text-align:left;white-space:nowrap}
td{padding:12px;border-top:1px solid #eee;font-size:14px;vertical-align:middle}
tbody tr:hover{background:#fffdf0}
.num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:1050px){.filter-grid{grid-template-columns:repeat(3,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.container{padding:16px 14px 35px}.page-top h2{font-size:20px}.filter-grid,.kpi-grid{grid-template-columns:1fr}.actions{justify-content:stretch}.btn{width:100%}}
</style>
</head>
<body>
<div class="container">
<div class="page-top"><h2>DOCTOR ANALYTICS</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div>

<div class="card">
<h3>Average Prescriptions vs Average Secondary Sales</h3>
<div class="filter-grid">
<div><label for="startMonth">Start Month</label><select id="startMonth"></select></div>
<div><label for="endMonth">End Month</label><select id="endMonth"></select></div>
<div><label for="year">Year</label><select id="year"></select></div>
<div><label for="hq">HQ</label><select id="hq" onchange="loadMarkets()"></select></div>
<div><label for="market">Market</label><select id="market"></select></div>
<div><label for="product">Product</label><select id="product"></select></div>
</div>
<div class="actions"><button class="btn" onclick="generateReport()">GENERATE ANALYSIS</button></div>
<div id="message" class="message"></div>
</div>

<div id="report"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260906-5"></script>
<script>
const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
let hqs=[],markets=[],products=[];
const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className='message '+(e?'error':'success')};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function init(){
 const r=await getCurrentUserProfile();if(r.error){location.href='index.html';return}
 const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
 startMonth.innerHTML=months.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===1?'selected':''}>${m}</option>`).join('');
 endMonth.innerHTML=months.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===cm?'selected':''}>${m}</option>`).join('');
 year.innerHTML=[cy-1,cy,cy+1].map(y=>`<option value="${y}" ${y===cy?'selected':''}>${y}</option>`).join('');
 let z=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(z.error){msg(z.error.message,true);return}hqs=z.data||[];
 hq.innerHTML='<option value="">All HQs</option>'+hqs.map(x=>`<option value="${x.id}">${esc(x.hq_name)}</option>`).join('');
 z=await client.from('products').select('id,product_name').order('product_name');if(z.error){msg(z.error.message,true);return}products=z.data||[];
 product.innerHTML='<option value="">All Products</option>'+products.map(x=>`<option value="${x.id}">${esc(x.product_name)}</option>`).join('');
 await loadMarkets();
}
async function loadMarkets(){
 const h=hq.value;let q=client.from('markets').select('id,market_name,hq_id').eq('active',true).order('market_name');if(h)q=q.eq('hq_id',h);
 const z=await q;if(z.error){msg(z.error.message,true);return}markets=z.data||[];
 market.innerHTML='<option value="">All Markets</option>'+markets.map(x=>`<option value="${x.id}">${esc(x.market_name)}</option>`).join('');
}
async function generateReport(){
 const sm=+startMonth.value,em=+endMonth.value,y=+year.value,h=hq.value,ma=market.value,p=product.value;
 if(sm>em){msg('Start Month cannot be after End Month.',true);return}
 const monthCount=em-sm+1;msg('Generating analysis...');report.innerHTML='';
 try{
  let dq=client.from('doctors').select('id,hq_id,market_id').eq('active',true);if(h)dq=dq.eq('hq_id',h);if(ma)dq=dq.eq('market_id',ma);
  const dr=await dq;if(dr.error)throw dr.error;const doctors=dr.data||[],doctorIds=doctors.map(d=>d.id),hqIds=[...new Set(doctors.map(d=>d.hq_id))];
  let rxQuery=client.from('doctor_prescriptions').select('doctor_id,product_id,rx_count').gte('month',sm).lte('month',em).eq('year',y);if(doctorIds.length)rxQuery=rxQuery.in('doctor_id',doctorIds);else rxQuery=rxQuery.eq('doctor_id','00000000-0000-0000-0000-000000000000');if(p)rxQuery=rxQuery.eq('product_id',p);
  const rr=await rxQuery;if(rr.error)throw rr.error;
  const rxMap=new Map();(rr.data||[]).forEach(x=>{const k=String(x.product_id);rxMap.set(k,(rxMap.get(k)||0)+(Number(x.rx_count)||0))});

  let salesMap=new Map();
  if(hqIds.length){
   let sq=client.from('sales_entry_header').select('id,hq_id,month').gte('month',sm).lte('month',em).eq('year',y);if(h)sq=sq.eq('hq_id',h);else sq=sq.in('hq_id',hqIds);
   const sh=await sq;if(sh.error)throw sh.error;const headers=sh.data||[];
   if(headers.length){const ids=headers.map(x=>x.id);let sdq=client.from('sales_entry_details').select('entry_id,product_id,secondary_units').in('entry_id',ids);if(p)sdq=sdq.eq('product_id',p);const sd=await sdq;if(sd.error)throw sd.error;(sd.data||[]).forEach(x=>{const k=String(x.product_id);salesMap.set(k,(salesMap.get(k)||0)+(Number(x.secondary_units)||0))})}
  }

  const selectedProducts=p?products.filter(x=>x.id===p):products;
  const rows=selectedProducts.map(pr=>{const totalRx=rxMap.get(String(pr.id))||0,totalSales=salesMap.get(String(pr.id))||0,avgRx=totalRx/monthCount,avgSales=totalSales/monthCount,gap=avgSales-avgRx,match=avgRx||avgSales?Math.min(avgRx,avgSales)/Math.max(avgRx,avgSales)*100:100;return {name:pr.product_name,avgRx,avgSales,gap,match,totalRx,totalSales}});
  const overallRx=rows.reduce((s,r)=>s+r.totalRx,0)/monthCount,overallSales=rows.reduce((s,r)=>s+r.totalSales,0)/monthCount,overallGap=overallSales-overallRx,overallMatch=overallRx||overallSales?Math.min(overallRx,overallSales)/Math.max(overallRx,overallSales)*100:100;
  const hqLabel=h?(hqs.find(x=>x.id===h)?.hq_name||'Selected HQ'):'All HQs',marketLabel=ma?(markets.find(x=>x.id===ma)?.market_name||'Selected Market'):'All Markets';
  let html=`<div class="card"><h3>Analysis: ${months[sm]}–${months[em]} ${y}</h3><div class="kpi-grid"><div class="kpi"><span>Average Prescriptions / Month</span><b>${overallRx.toFixed(1)}</b></div><div class="kpi"><span>Average Secondary Units / Month</span><b>${overallSales.toFixed(1)}</b></div><div class="kpi"><span>Average Gap (Secondary − Rx)</span><b>${overallGap>=0?'+':''}${overallGap.toFixed(1)}</b></div><div class="kpi"><span>Overall Match %</span><b>${overallMatch.toFixed(1)}%</b></div></div><p class="muted">Period: ${months[sm]} to ${months[em]} ${y} (${monthCount} month${monthCount>1?'s':''}) · ${esc(hqLabel)} · ${esc(marketLabel)}. Averages are calculated as total prescriptions or secondary units divided by the number of selected months.</p></div>`;
  html+=`<div class="card"><h3>Product-wise Average Comparison</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">Avg Rx / Month</th><th class="num">Avg Secondary Units / Month</th><th class="num">Gap</th><th class="num">Match %</th></tr></thead><tbody>`;
  html+=rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${r.avgRx.toFixed(1)}</td><td class="num">${r.avgSales.toFixed(1)}</td><td class="num">${r.gap>=0?'+':''}${r.gap.toFixed(1)}</td><td class="num">${r.match.toFixed(1)}%</td></tr>`).join('')||'<tr><td colspan="5">No products found.</td></tr>';
  html+=`</tbody></table></div><p class="muted">Secondary sales are captured at stockist/HQ level, not doctor level. Therefore the comparison is a product-level average Rx versus average secondary-units view. If a Market is selected, the Rx side is restricted to doctors in that Market; secondary sales remain at the available HQ level because sales are not market-linked.</p></div>`;
  report.innerHTML=html;msg('Analysis generated successfully.');
 }catch(e){console.error(e);msg(e.message||'Unable to generate analysis.',true)}
}
init();
</script>
</body>
</html>
