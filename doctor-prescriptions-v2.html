<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hexadox MIS - Doctor Prescriptions</title><link rel="stylesheet" href="style.css?v=20260906-4"><link rel="stylesheet" href="theme-yellow.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#222;font-family:Arial,sans-serif}.container{width:100%;max-width:none;margin:0 auto;padding:24px 28px 45px}.page-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;padding:16px 20px;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);border-left:5px solid #f0c419}.page-top h2{margin:0;font-size:23px;letter-spacing:.3px}.back-button{min-width:110px;background:#fff;color:#222;border:1px solid #ddd;padding:10px 20px;border-radius:7px;cursor:pointer;font-weight:700}.card{background:#fff;border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:0 3px 14px rgba(0,0,0,.07)}.form-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end}.form-grid label{display:block;font-size:13px;font-weight:700;color:#555;margin:0 0 7px}.form-grid input,.form-grid select,.add-product-bar select,.table-wrap input,.table-wrap select{width:100%;height:42px;padding:9px 11px;border:1px solid #d5d9dc;border-radius:7px;background:#fff;color:#222;font-size:14px}.form-grid input:focus,.form-grid select:focus,.add-product-bar select:focus,.table-wrap input:focus,.table-wrap select:focus{outline:none;border-color:#d6ad00;box-shadow:0 0 0 2px rgba(240,196,25,.18)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn,.small-btn{border:0;border-radius:7px;background:#f0c419;color:#222;font-weight:700;cursor:pointer}.btn{min-height:42px;padding:0 20px}.btn.secondary{background:#eee8c9}.add-product-bar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.add-product-bar .btn{min-width:165px}.card h3{margin:0 0 16px;font-size:18px;padding-bottom:12px;border-bottom:1px solid #eee}.muted{font-size:13px;line-height:1.5;color:#666;margin:12px 0 18px}.table-wrap{width:100%;overflow-x:auto;border:1px solid #e4e6e8;border-radius:8px}.table-wrap table{width:100%;border-collapse:collapse;min-width:650px}.table-wrap th{background:#292929;color:#fff;font-size:13px;padding:11px 12px;text-align:left;white-space:nowrap}.table-wrap td{padding:10px 12px;border-top:1px solid #eee;font-size:14px;vertical-align:middle}.table-wrap tbody tr:hover{background:#fffdf0}.table-wrap td:nth-child(2){width:190px}.table-wrap td:nth-child(3){width:150px}.small-btn{padding:9px 13px;font-size:13px;white-space:nowrap}.message{min-height:20px;margin-top:12px;font-size:13px;font-weight:600}.message.success{color:#2e7d32}.message.error{color:#c62828}.info{margin-top:10px;font-size:13px;color:#666}.card:first-of-type{padding-bottom:18px}@media(max-width:900px){.container{padding:16px 14px 35px}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.actions{justify-content:stretch}.actions .btn{width:100%}.add-product-bar{grid-template-columns:1fr}.add-product-bar .btn{width:100%}.page-top h2{font-size:19px}}
</style></head><body><div class="container"><div class="page-top"><h2>MONTHLY DOCTOR PRESCRIPTIONS</h2><button class="back-button" onclick="location.href='home.html'">HOME</button></div><div class="card"><div class="form-grid"><div><label>Month</label><select id="month"></select></div><div><label>Year</label><select id="year"></select></div><div><label>HQ</label><select id="hq" onchange="loadDoctors()"></select></div><div><label>Market</label><input id="market" type="text" placeholder="Type market name" oninput="loadDoctors()" autocomplete="off"></div><div><label>Doctor</label><select id="doctor" onchange="loadExisting()"></select></div></div><div class="actions"><button class="btn secondary" onclick="carryForward()">↻ CARRY FORWARD PREVIOUS MONTH</button></div><div id="info" class="info"></div></div><div class="card"><h3>Product-wise Prescription Entry</h3><p class="muted">All products are listed for every doctor and month. Products without prescriptions can remain at 0 Rx.</p><div class="table-wrap"><table><thead><tr><th>Product</th><th>Status</th><th>No. of Rx</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="btn" onclick="saveAll()">SAVE MONTHLY PRESCRIPTIONS</button></div><div id="message" class="message"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20260906-4"></script><script>let hqs=[],markets=[],doctors=[],products=[],rows=[];const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className='message '+(e?'error':'success')};async function init(){const r=await getCurrentUserProfile();if(r.error){location.href='index.html';return}const now=new Date();document.getElementById('month').innerHTML=months.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===now.getMonth()+1?'selected':''}>${m}</option>`).join('');document.getElementById('year').innerHTML=[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1].map(y=>`<option ${y===now.getFullYear()?'selected':''}>${y}</option>`).join('');const z=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(z.error){msg(z.error.message,true);return}hqs=z.data||[];document.getElementById('hq').innerHTML='<option value="">Select HQ</option>'+hqs.map(h=>`<option value="${h.id}">${esc(h.hq_name)}</option>`).join('');await loadMarkets();await loadProducts()}async function loadMarkets(){let q=client.from('markets').select('id,market_name,hq_id').eq('active',true).order('market_name');const z=await q;if(z.error){msg(z.error.message,true);return}markets=z.data||[]}async function loadDoctors(){const h=document.getElementById('hq').value,m=(document.getElementById('market').value||'').trim().toLowerCase();let q=client.from('doctors').select('id,doctor_name,market_id,hq_id').eq('active',true).order('doctor_name');if(h)q=q.eq('hq_id',h);const z=await q;if(z.error){msg(z.error.message,true);return}let list=z.data||[];if(m)list=list.filter(d=>(markets.find(x=>x.id===d.market_id)?.market_name||'').toLowerCase().includes(m));doctors=list;document.getElementById('doctor').innerHTML='<option value="">Select Doctor</option>'+doctors.map(d=>`<option value="${d.id}">${esc(d.doctor_name)}</option>`).join('');rows=products.map(p=>({product_id:p.id,doctor_status:'Target Dr',rx_count:0}));render()}async function loadProducts(){const z=await client.from('products').select('id,product_name').order('product_name');if(z.error){msg(z.error.message,true);return}products=z.data||[];}async function loadExisting(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d)return;const z=await client.from('doctor_prescriptions').select('product_id,doctor_status,rx_count').eq('doctor_id',d).eq('month',m).eq('year',y);if(z.error){msg(z.error.message,true);return}const saved=new Map((z.data||[]).map(x=>[String(x.product_id),x]));rows=products.map(p=>({...({product_id:p.id,doctor_status:'Target Dr',rx_count:0}),...(saved.get(String(p.id))||{})}));render()}function render(){const map=new Map(products.map(p=>[p.id,p.product_name]));rows.sort((a,b)=>(map.get(a.product_id)||'').localeCompare(map.get(b.product_id)||''));document.getElementById('rows').innerHTML=rows.map((r,i)=>`<tr data-i="${i}"><td>${esc(map.get(r.product_id)||'Unknown')}</td><td><select data-f="status"><option ${r.doctor_status==='Prescriber'?'selected':''}>Prescriber</option><option ${r.doctor_status==='Target Dr'?'selected':''}>Target Dr</option></select></td><td><input type="number" step="1" data-f="rx" value="${Number(r.rx_count)||0}"></td></tr>`).join('')||'<tr><td colspan="3">No products found.</td></tr>'}async function carryForward(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d){msg('Select a doctor first.',true);return}let pm=m-1,py=y;if(pm===0){pm=12;py--}const z=await client.from('doctor_prescriptions').select('product_id,doctor_status').eq('doctor_id',d).eq('month',pm).eq('year',py);if(z.error){msg(z.error.message,true);return}if(!z.data?.length){msg(`No prescription structure found for ${months[pm]} ${py}.`,true);return}const prior=new Map(z.data.map(x=>[String(x.product_id),x]));rows=products.map(p=>({product_id:p.id,doctor_status:prior.get(String(p.id))?.doctor_status||'Target Dr',rx_count:0}));render();document.getElementById('info').textContent=`Carried forward ${rows.length} product entries from ${months[pm]} ${py}. Rx counts were reset to 0.`}async function saveAll(){const d=document.getElementById('doctor').value,m=+document.getElementById('month').value,y=+document.getElementById('year').value;if(!d){msg('Select a doctor.',true);return}document.querySelectorAll('#rows tr[data-i]').forEach(tr=>{const i=+tr.dataset.i;rows[i].doctor_status=tr.querySelector('[data-f="status"]').value;rows[i].rx_count=parseInt(tr.querySelector('[data-f="rx"]').value||0,10)});if(!rows.length){msg('No products are available.',true);return}const r=await getCurrentUserProfile();if(r.error){msg(r.error.message,true);return}const payload=rows.map(x=>({doctor_id:d,month:m,year:y,product_id:x.product_id,doctor_status:x.doctor_status,rx_count:x.rx_count,entered_by:r.user.id}));const z=await client.from('doctor_prescriptions').upsert(payload,{onConflict:'doctor_id,month,year,product_id'});if(z.error){msg(z.error.message,true);return}msg('Monthly prescriptions saved successfully.');await loadExisting()}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}init();</script></body></html>
