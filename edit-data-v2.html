<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="cache-version" content="20261010-06"><title>Hexadox MIS - Edit Submitted Data</title>
<link rel="stylesheet" href="theme-yellow.css?v=20261010-06">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f6;color:#222}.header{background:#f4c400;color:#111;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}.header h2{margin:0;font-size:22px}.btn{border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;background:#f4c400;color:#111}.btn:disabled{opacity:.6}.back{background:#fff}.container{width:100%;max-width:none;margin:25px auto;padding:0 20px}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #00000014;margin-bottom:20px}.toggle{display:flex;gap:10px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}label{display:block;font-weight:bold;margin-bottom:7px}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:15px}.info{background:#fff8d6;border-left:5px solid #f4c400;padding:12px 15px;margin-bottom:18px}.table-container{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1450px}th{background:#f4c400;padding:11px 8px;text-align:center}td{padding:8px;border-bottom:1px solid #ddd;text-align:center}td.product{text-align:left;font-weight:500}.value{font-weight:bold;text-align:right}.message{margin-top:15px;padding:12px;border-radius:5px;text-align:center;font-weight:bold}.success{background:#d9f5e9;color:#146c43}.error{background:#f8d7da;color:#842029}.loading{text-align:center;padding:25px;font-weight:bold}.hidden{display:none!important}.changed{background:#fff3bf!important}.addbar{display:flex;gap:10px;margin-bottom:15px}.addbar select{max-width:450px}.remove{background:#f8d7da;color:#842029;border:1px solid #e3a6ad;padding:7px 10px;border-radius:5px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.toggle,.addbar{flex-direction:column}.header h2{font-size:18px}}
</style></head>
<body>
<div class="header"><h2>HEXADOX MIS — EDIT SUBMITTED DATA</h2><button class="btn back" onclick="goHome()">HOME</button></div>
<div class="container">
<div class="card"><h3>Edit Existing Data</h3>
<div class="toggle"><button id="salesMode" class="btn" onclick="setMode('sales')">EDIT SUBMITTED SALES</button><button id="targetMode" class="btn" onclick="setMode('targets')">EDIT TARGET SHEET</button></div>
<div id="salesInfo" class="info">For submitted sales, select Month, Year, HQ and Stockist.</div><div id="targetInfo" class="info hidden">Target-sheet editing is temporarily disabled while submitted-sales editing is being verified.</div>
<div class="grid"><div><label>Month</label><select id="month"><option value="">Select Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
<div><label>Year</label><select id="year"><option value="">Select Year</option></select></div><div><label>HQ</label><select id="hq"><option value="">Loading HQ...</option></select></div><div id="stockistBox"><label>Stockist</label><select id="stockist" disabled><option value="">Select Stockist</option></select></div></div>
<div style="text-align:center;margin-top:22px"><button id="loadButton" class="btn" onclick="loadCurrentData()">LOAD SUBMITTED SALES</button> <button id="secondaryStatementButton" class="btn" onclick="openSecondaryStatement()">EDIT STOCKIST SECONDARY STATEMENT</button></div></div>
<div class="card"><h3 id="resultTitle">Submitted Product Data</h3><div id="productArea"><div class="loading">Select the filters and click LOAD.</div></div><div id="saveArea" class="hidden" style="text-align:center;margin-top:25px"><button id="saveButton" class="btn" onclick="saveCurrentData()">SAVE CHANGES</button></div></div>
<div id="message" class="message hidden"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://euyqvisqgxuwzcswwiqf.supabase.co';
const SUPABASE_KEY='sb_publishable_4YiBchy04wWSH4K74uXNiw_F0TUILqF';
let client,mode='sales',header=null,sales=[],products=[];
const $=id=>document.getElementById(id);
const esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};
const money=x=>Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function msg(t,c){const e=$('message');e.textContent=t;e.className='message '+c;e.classList.remove('hidden')}
function goHome(){location.href='home.html?v=20261010-05'}
function years(){const s=$('year'),y=new Date().getFullYear();for(let n=y-2;n<=y+1;n++)s.appendChild(new Option(n,n))}
async function init(){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const q=await client.auth.getSession();if(q.error)throw q.error;if(!q.data.session){location.href='index.html';return}years();const d=new Date();$('month').value=d.getMonth()+1;$('year').value=d.getFullYear();await hqs();setMode('sales');const p=new URLSearchParams(location.search);if(p.get('month'))$('month').value=p.get('month');if(p.get('year'))$('year').value=p.get('year');if(p.get('hq')){$('hq').value=p.get('hq');await stockists();if(p.get('stockist'))$('stockist').value=p.get('stockist')}}
async function hqs(){const q=await client.from('hqs').select('id,hq_name').eq('active',true).order('hq_name');if(q.error)throw q.error;$('hq').innerHTML='<option value="">Select HQ</option>';(q.data||[]).forEach(x=>$('hq').appendChild(new Option(x.hq_name,x.id)))}
async function stockists(){const h=$('hq').value,s=$('stockist');s.disabled=true;if(!h){s.innerHTML='<option value="">Select Stockist</option>';return}s.innerHTML='<option>Loading Stockists...</option>';const q=await client.from('stockists').select('id,stockist_name').eq('hq_id',h).eq('active',true).order('stockist_name');if(q.error){msg(q.error.message,'error');return}s.innerHTML='<option value="">Select Stockist</option>';(q.data||[]).forEach(x=>s.appendChild(new Option(x.stockist_name,x.id)));s.disabled=false}
$('hq').addEventListener('change',stockists);
function setMode(m){mode=m;$('salesMode').classList.toggle('active',m==='sales');$('targetMode').classList.toggle('active',m==='targets');$('salesInfo').classList.toggle('hidden',m!=='sales');$('targetInfo').classList.toggle('hidden',m!=='targets');$('stockistBox').classList.toggle('hidden',m==='targets');$('secondaryStatementButton').classList.toggle('hidden',m==='targets');$('loadButton').textContent=m==='sales'?'LOAD SUBMITTED SALES':'LOAD TARGET SHEET';$('resultTitle').textContent=m==='sales'?'Submitted Product Data':'Submitted Target Sheet';$('productArea').innerHTML='<div class="loading">Select the filters and click LOAD.</div>';$('saveArea').classList.add('hidden');if(m==='sales')stockists()}
function openSecondaryStatement(){const m=$('month').value,y=$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||!s){msg('Please select Month, Year, HQ and Stockist first.','error');return}const p=new URLSearchParams({month:m,year:y,hq:h,stockist:s,returnTo:'edit-data-v2',v:'20261010-01'});location.href='stockist-secondary-statement.html?'+p.toString()}function loadCurrentData(){if(mode==='sales')return loadSales();return loadTargets()}
async function loadSales(){const m=+$('month').value,y=+$('year').value,h=$('hq').value,s=$('stockist').value;if(!m||!y||!h||!s){msg('Please select Month, Year, HQ and Stockist.','error');return}$('loadButton').disabled=true;$('loadButton').textContent='LOADING...';try{let q=await client.from('sales_entry_header').select('id,stockist_id,hq_id,month,year').eq('stockist_id',s).eq('hq_id',h).eq('month',m).eq('year',y).limit(1);if(q.error)throw q.error;if(!q.data?.length)throw Error('No submitted sales found.');header=q.data[0];q=await client.from('sales_entry_details').select('id,product_id,pts,primary_pts,secondary_pts,primary_units,primary_free_units,secondary_units,products(product_name)').eq('entry_id',header.id).order('id');if(q.error)throw q.error;sales=(q.data||[]).sort((a,b)=>(a.products?.product_name||'').localeCompare(b.products?.product_name||''));q=await client.from('products').select('id,product_name,price_apr_2026,price_may_2026,price_jun_2026,price_jul_2026,price_aug_2026,price_sep_2026,price_oct_2026,price_nov_2026,price_dec_2026,price_jan_2027,price_feb_2027,price_mar_2027').order('product_name');if(q.error)throw q.error;products=q.data||[];const saved=new Map(sales.map(r=>[String(r.product_id),r]));sales=products.map(p=>saved.get(String(p.id))||({id:null,product_id:p.id,pts:0,primary_pts:0,secondary_pts:0,primary_units:0,primary_free_units:0,secondary_units:0,products:{product_name:p.product_name}})).concat([...saved.entries()].filter(([id])=>!products.some(p=>String(p.id)===id)).map(([,r])=>r));renderSales()}catch(e){msg('LOAD FAILED: '+e.message,'error')}finally{$('loadButton').disabled=false;$('loadButton').textContent='LOAD SUBMITTED SALES'}}
function resolvedSavedPts(r,field,m,y){const saved=Number(r[field]);if(Number.isFinite(saved)&&saved!==0)return saved;const legacy=Number(r.pts)||0;if(y===2026&&m>=4&&m<=8)return legacy;const p=products.find(x=>String(x.id)===String(r.product_id));const master=monthlyPts(p,m,y);return master!==0?master:legacy}
function updateEditSalesTotals(){let pu=0,pv=0,fu=0,fv=0,su=0,sv=0;document.querySelectorAll('#productArea tr[data-id]').forEach(r=>{const pp=+r.querySelector('[data-f="pp"]').value||0,p=+r.querySelector('[data-f="pu"]').value||0,f=+r.querySelector('[data-f="fu"]').value||0,sp=+r.querySelector('[data-f="sp"]').value||0,s=+r.querySelector('[data-f="su"]').value||0;pu+=p;pv+=pp*p;fu+=f;fv+=pp*f;su+=s;sv+=sp*s;const cell=r.querySelector('.fv');if(cell)cell.textContent=money(pp*f)});const a=document.querySelector('.edit-total-primary-units'),b=document.querySelector('.edit-total-primary'),f=document.querySelector('.edit-total-free-units'),g=document.querySelector('.edit-total-free-value'),c=document.querySelector('.edit-total-secondary-units'),d=document.querySelector('.edit-total-secondary');if(a)a.textContent=pu.toLocaleString('en-IN');if(b)b.textContent=money(pv);if(f)f.textContent=fu.toLocaleString('en-IN');if(g)g.textContent=money(fv);if(c)c.textContent=su.toLocaleString('en-IN');if(d)d.textContent=money(sv)}
function renderSales(){let h='<div class="info"><b>Primary PTS and Secondary PTS are independent.</b><br>Primary Value = Primary PTS × Primary Units. Secondary Value = Secondary PTS × Secondary Units.</div><div class="table-container"><table><thead><tr><th>#</th><th>Product</th><th>Primary PTS</th><th>Primary Units</th><th>Primary Value</th><th>Free Units Reimbursement Units</th><th>Free Units Reimbursement Value</th><th>Secondary PTS</th><th>Secondary Units</th><th>Secondary Value</th></tr></thead><tbody>';
sales.forEach((r,i)=>{const id=String(r.id||'new_'+r.product_id),pp=resolvedSavedPts(r,'primary_pts',+$('month').value,+$('year').value),sp=resolvedSavedPts(r,'secondary_pts',+$('month').value,+$('year').value),pu=Number(r.primary_units)||0,fu=Number(r.primary_free_units)||0,su=Number(r.secondary_units)||0;h+='<tr data-id="'+id+'" data-product="'+r.product_id+'"><td>'+(i+1)+'</td><td class="product">'+esc(r.products?.product_name||'')+'</td><td><input type="number" step="0.01" data-f="pp" value="'+pp+'"></td><td><input type="number" step="1" data-f="pu" value="'+pu+'"></td><td class="value pv">'+money(pp*pu)+'</td><td><input type="number" step="1" data-f="fu" value="'+fu+'"></td><td class="value fv">'+money(pp*fu)+'</td><td><input type="number" step="0.01" data-f="sp" value="'+sp+'"></td><td><input type="number" step="1" data-f="su" value="'+su+'"></td><td class="value sv">'+money(sp*su)+'</td></tr>'});h+='<tfoot><tr class=\"total\"><td colspan=\"3\">TOTAL</td><td class=\"edit-total-primary-units\">0</td><td class=\"edit-total-primary\">0.00</td><td class=\"edit-total-free-units\">0</td><td class=\"edit-total-free-value\">0.00</td><td></td><td class=\"edit-total-secondary-units\">0</td><td class=\"edit-total-secondary\">0.00</td></tr></tfoot></tbody></table></div>';$('productArea').innerHTML=h;updateEditSalesTotals();$('saveArea').classList.remove('hidden');document.querySelectorAll('#productArea tr[data-id] input').forEach(i=>i.addEventListener('input',()=>{const r=i.closest('tr'),pp=+r.querySelector('[data-f="pp"]').value||0,pu=+r.querySelector('[data-f="pu"]').value||0,sp=+r.querySelector('[data-f="sp"]').value||0,su=+r.querySelector('[data-f="su"]').value||0;r.querySelector('.pv').textContent=money(pp*pu);r.querySelector('.sv').textContent=money(sp*su);updateEditSalesTotals();i.classList.add('changed')}))}
async function saveCurrentData(){if(mode==='sales')return saveSales();msg('Target-sheet editing is temporarily disabled while we finish the sales save fix.','error')}
async function saveSales(){if(!header){msg('Load a submitted entry first.','error');return}const b=$('saveButton');b.disabled=true;b.textContent='SAVING...';msg('SAVING TO DATABASE...','success');try{const desired=[];document.querySelectorAll('#productArea tr[data-id]').forEach(tr=>{const g=f=>tr.querySelector('[data-f="'+f+'"]'),pp=Number(g('pp').value),sp=Number(g('sp').value),pu=Number(g('pu').value),fu=Number(g('fu').value),su=Number(g('su').value);if(!Number.isFinite(pp)||!Number.isFinite(sp)||!Number.isInteger(pu)||!Number.isInteger(fu)||!Number.isInteger(su))throw Error('Invalid values for '+tr.querySelector('.product').textContent);desired.push({id:tr.dataset.id,product_id:tr.dataset.product,pp,sp,pu,fu,su})});const keep=new Set();for(const r of desired){const payload={pts:r.pp,primary_pts:r.pp,secondary_pts:r.sp,primary_units:r.pu,primary_free_units:r.fu,secondary_units:r.su};if(r.id.startsWith('new_')){const q=await client.from('sales_entry_details').insert({entry_id:header.id,product_id:r.product_id,...payload}).select('id');if(q.error)throw q.error;if(!q.data?.length)throw Error('Insert did not return a row.');keep.add(String(q.data[0].id))}else{const q=await client.from('sales_entry_details').update(payload).eq('id',r.id).eq('entry_id',header.id);if(q.error)throw q.error;keep.add(String(r.id))}}let q=await client.from('sales_entry_details').select('id').eq('entry_id',header.id);if(q.error)throw q.error;for(const old of q.data||[]){if(!keep.has(String(old.id))){const d=await client.from('sales_entry_details').delete().eq('id',old.id).eq('entry_id',header.id);if(d.error)throw d.error}}const v=await client.from('sales_entry_details').select('id,pts,primary_pts,secondary_pts,primary_units,primary_free_units,secondary_units,primary_value,secondary_value').eq('entry_id',header.id);if(v.error)throw v.error;if((v.data||[]).length!==desired.length)throw Error('Verification failed: saved row count is different.');for(const r of desired){const row=(v.data||[]).find(x=>String(x.id)===String(r.id));if(row){if(Number(row.primary_pts)!==r.pp||Number(row.secondary_pts)!==r.sp||Number(row.primary_units)!==r.pu||Number(row.primary_free_units||0)!==r.fu||Number(row.secondary_units)!==r.su)throw Error('Verification failed: saved values do not match.')}}msg('SAVED SUCCESSFULLY.','success');await loadSales()}catch(e){msg('SAVE FAILED: '+(e.message||e),'error')}finally{b.disabled=false;b.textContent='SAVE CHANGES'}}
function loadTargets(){msg('Target-sheet editing will be restored after sales editing is confirmed.','error')}
init().catch(e=>msg('INITIALIZATION FAILED: '+e.message,'error'));
</script></body></html>
